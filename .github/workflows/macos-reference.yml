name: macOS reference

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/macos-reference.yml"
      - "build-reference-app.command"
      - "run-reference-app.command"
      - "macos/**"
  pull_request:
    paths:
      - ".github/workflows/macos-reference.yml"
      - "build-reference-app.command"
      - "run-reference-app.command"
      - "macos/**"

permissions:
  contents: read

concurrency:
  group: font-previewer-macos-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test-build-package:
    name: Test, smoke, and package preserved reference
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test portable core and macOS kit
        run: swift test --package-path macos

      - name: Native system-font smoke gauntlet
        run: |
          swift run \
            --package-path macos \
            -c release \
            FontPreviewerSmoke \
            --output "$RUNNER_TEMP/font-previewer-smoke"

      - name: Build, sign, package, re-extract, and verify
        run: ./build-reference-app.command --skip-tests

      - name: Inspect packaged app
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$(find output -maxdepth 1 -type d -name 'macos-reference-*' -print | LC_ALL=C sort | tail -n 1)"
          test -n "$ARTIFACT_DIR"
          ZIP="$ARTIFACT_DIR/Font Previewer Reference.zip"
          CHECKSUM="$ZIP.sha256"
          test -s "$ZIP"
          test -s "$CHECKSUM"
          (cd "$ARTIFACT_DIR" && shasum -a 256 -c "Font Previewer Reference.zip.sha256")
          VERIFY="$RUNNER_TEMP/font-previewer-verify"
          mkdir -p "$VERIFY"
          ditto -x -k "$ZIP" "$VERIFY"
          APP="$VERIFY/Font Previewer Reference.app"
          test -x "$APP/Contents/MacOS/FontPreviewer"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dog.pitch.fontpreviewer.reference"
          codesign --verify --deep --strict --verbose=2 "$APP"
          printf '%s\n' "$VERIFIED_SHA" > "$ARTIFACT_DIR/SOURCE_SHA"

      - name: Upload verified reference app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Font-Previewer-reference-macOS-${{ env.VERIFIED_SHA }}
          path: |
            output/macos-reference-*/Font Previewer Reference.zip
            output/macos-reference-*/Font Previewer Reference.zip.sha256
            output/macos-reference-*/SOURCE_SHA
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Font-Previewer-reference-smoke-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-smoke
          if-no-files-found: error
          retention-days: 14
