name: Prepare Font Previewer release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact full commit SHA on current main
        required: true
        type: string
      verification_run_id:
        description: Successful Verify Font Previewer run for target_sha
        required: true
        type: string
      tag:
        description: New prerelease tag, for example v0.1.0-rc.2
        required: true
        type: string
      publish:
        description: Create a public prerelease after validation
        required: true
        default: false
        type: boolean
      confirmation:
        description: When publishing, repeat the exact requested tag
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: font-previewer-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate exact artifacts and prepare prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RUN_ID: ${{ inputs.verification_run_id }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          if [[ "$PUBLISH" == "true" ]]; then
            test "$CONFIRMATION" = "$TAG"
          else
            test -z "$CONFIRMATION" || test "$CONFIRMATION" = "$TAG"
          fi

      - name: Check out exact target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target is current main and versions agree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          VERSION="$(node -p "require('./app/package.json').version")"
          RELEASE_VERSION="${TAG#v}"
          RELEASE_NOTES_PATH="docs/releases/$TAG.md"
          test "${RELEASE_VERSION%%-rc.*}" = "$VERSION"
          test -s "$RELEASE_NOTES_PATH"
          grep -Fqx "## $RELEASE_VERSION — Unreleased" <(grep '^## ' CHANGELOG.md | head -n 1)
          (cd app && npm run version:check)
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_NOTES_PATH=%s\n' "$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Refuse existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag: $TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $TAG" >&2
            exit 1
          fi

      - name: Verify exact successful workflow run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$TARGET_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .head_sha == $sha and
            .path == ".github/workflows/verify.yml"
          ' "$RUNNER_TEMP/run.json" >/dev/null

      - name: Download exact-SHA artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/candidate/macos" "$RUNNER_TEMP/candidate/linux"

          download_artifact() {
            local name="$1"
            local destination="$2"
            local id
            id="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$RUNNER_TEMP/artifacts.json")"
            test -n "$id"
            test "$(printf '%s\n' "$id" | wc -l | tr -d ' ')" = "1"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              --output "$RUNNER_TEMP/downloads/$name.zip"
            unzip -q "$RUNNER_TEMP/downloads/$name.zip" -d "$destination"
          }

          download_artifact "font-previewer-macos-$TARGET_SHA" "$RUNNER_TEMP/candidate/macos"
          download_artifact "font-previewer-linux-$TARGET_SHA" "$RUNNER_TEMP/candidate/linux"

      - name: Verify and assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/release-bundle"
          mkdir -p "$BUNDLE" "$RUNNER_TEMP/macos-expanded"

          MAC_ZIP="$(find "$RUNNER_TEMP/candidate/macos" -type f -name 'Font Previewer.zip' -print -quit)"
          MAC_SUM="$(find "$RUNNER_TEMP/candidate/macos" -type f -name 'Font Previewer.zip.sha256' -print -quit)"
          MAC_SOURCE="$(find "$RUNNER_TEMP/candidate/macos" -type f -name 'SOURCE_SHA' -print -quit)"
          test -s "$MAC_ZIP"
          test -s "$MAC_SUM"
          test "$(cat "$MAC_SOURCE")" = "$TARGET_SHA"
          (cd "$(dirname "$MAC_ZIP")" && sha256sum -c "$(basename "$MAC_SUM")")
          unzip -tq "$MAC_ZIP"
          if unzip -Z1 "$MAC_ZIP" | grep -Eiq '\.(ttf|otf|woff2?|ttc|otc)$'; then
            echo "Refusing macOS package containing a font binary." >&2
            exit 1
          fi
          unzip -q "$MAC_ZIP" -d "$RUNNER_TEMP/macos-expanded"
          MAC_APP="$(find "$RUNNER_TEMP/macos-expanded" -maxdepth 2 -type d -name 'Font Previewer.app' -print -quit)"
          test -n "$MAC_APP"
          python - "$MAC_APP/Contents/Info.plist" "$VERSION" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as handle:
              plist = plistlib.load(handle)
          assert plist["CFBundleShortVersionString"] == sys.argv[2]
          PY
          BINARY_INFO="$(file "$MAC_APP/Contents/MacOS/FontPreviewer")"
          if [[ "$BINARY_INFO" == *arm64* && "$BINARY_INFO" == *x86_64* ]]; then
            MAC_ARCH=universal
          elif [[ "$BINARY_INFO" == *arm64* || "$BINARY_INFO" == *aarch64* ]]; then
            MAC_ARCH=arm64
          elif [[ "$BINARY_INFO" == *x86_64* ]]; then
            MAC_ARCH=x86_64
          else
            echo "Could not identify macOS package architecture: $BINARY_INFO" >&2
            exit 1
          fi
          cp "$MAC_ZIP" "$BUNDLE/Font-Previewer-$VERSION-macOS-$MAC_ARCH.zip"

          LINUX_PORTABLE="$(find "$RUNNER_TEMP/candidate/linux" -type f -name "Font-Previewer-$VERSION-linux-x64.tar.gz" -print -quit)"
          LINUX_DEB="$(find "$RUNNER_TEMP/candidate/linux" -type f -name "font-previewer_${VERSION}_amd64.deb" -print -quit)"
          LINUX_SUM="$(find "$RUNNER_TEMP/candidate/linux" -type f -name 'checksums.sha256' -print -quit)"
          LINUX_SOURCE="$(find "$RUNNER_TEMP/candidate/linux" -type f -name 'SOURCE_SHA' -print -quit)"
          test -s "$LINUX_PORTABLE"
          test -s "$LINUX_DEB"
          test -s "$LINUX_SUM"
          test "$(cat "$LINUX_SOURCE")" = "$TARGET_SHA"
          (cd "$(dirname "$LINUX_SUM")" && sha256sum -c "$(basename "$LINUX_SUM")")
          tar -tzf "$LINUX_PORTABLE" >/dev/null
          dpkg-deb --info "$LINUX_DEB" >/dev/null
          if tar -tzf "$LINUX_PORTABLE" | grep -Eiq '\.(ttf|otf|woff2?|ttc|otc)$'; then
            echo "Refusing Linux package containing a font binary." >&2
            exit 1
          fi
          cp "$LINUX_PORTABLE" "$LINUX_DEB" "$BUNDLE/"

          cp app/sbom.cdx.json "$BUNDLE/font-previewer-$VERSION-sbom.cdx.json"
          cp app/THIRD_PARTY_NOTICES.md "$BUNDLE/THIRD_PARTY_NOTICES.md"
          cp LICENSE "$BUNDLE/LICENSE.txt"
          cp "$RELEASE_NOTES_PATH" "$BUNDLE/RELEASE_NOTES.md"
          printf '%s\n' "$TARGET_SHA" > "$BUNDLE/SOURCE_SHA"
          (cd "$BUNDLE" && sha256sum Font-Previewer-* font-previewer_* *.json *.md LICENSE.txt SOURCE_SHA > SHA256SUMS)
          (cd "$BUNDLE" && sha256sum -c SHA256SUMS)
          tar -C "$BUNDLE" -czf "$RUNNER_TEMP/Font-Previewer-$RELEASE_VERSION-release-dry-run-$TARGET_SHA.tar.gz" .

      - name: Upload validated dry-run bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-release-dry-run-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/Font-Previewer-${{ env.RELEASE_VERSION }}-release-dry-run-${{ inputs.target_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease only when explicitly confirmed
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "$TAG"
          BUNDLE="$RUNNER_TEMP/release-bundle"
          gh release create "$TAG" "$BUNDLE"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Font Previewer $RELEASE_VERSION" \
            --notes-file "$BUNDLE/RELEASE_NOTES.md" \
            --prerelease
