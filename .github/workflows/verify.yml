name: Verify Font Previewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify.yml"
      - "app/**"
  pull_request:
    paths:
      - ".github/workflows/verify.yml"
      - "app/**"

permissions:
  contents: read

concurrency:
  group: font-previewer-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  linux:
    name: Linux Electron · evidence · packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
          package-manager-cache: false

      - name: Verify version surfaces
        run: npm run version:check

      - name: Install displayed-app dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 fonts-inter-variable weston xauth xvfb

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install exact Electron binary
        run: npm run electron:install

      - name: Set reproducible package epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Configure production sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat --format='%U:%G %a' node_modules/electron/dist/chrome-sandbox)" = "root:root 4755"

      - name: Verify types, tests, bundles, SBOM, and audit
        run: npm run verify

      - name: Assert verification did not change tracked source
        run: git diff --exit-code

      - name: Run 500-face long-session diagnostic
        env:
          FONT_PREVIEWER_SOAK_OUTPUT: ${{ runner.temp }}/font-previewer-linux-soak/soak.json
        run: npm run evidence:soak

      - name: Run displayed Electron release evidence
        env:
          FONT_PREVIEWER_EVIDENCE_DIR: ${{ runner.temp }}/font-previewer-linux-evidence
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          timeout --signal=TERM --kill-after=10s 4m \
            xvfb-run --auto-servernum --server-args="-screen 0 1500x980x24" \
            dbus-run-session -- npm run electron -- --disable-dev-shm-usage

      - name: Assert Linux evidence
        env:
          EVIDENCE: ${{ runner.temp }}/font-previewer-linux-evidence
        run: |
          jq -e '
            .securityAudit.invalidRequests == .securityAudit.rejected and
            .securityAudit.nodeUnavailable == true and
            .keyboardAccessibility.forwardWrap == true and
            .keyboardAccessibility.backwardWrap == true and
            .keyboardAccessibility.candidateUnchanged == true and
            .keyboardAccessibility.trayUnchanged == true and
            .keyboardAccessibility.returnFocus == true and
            .installedCatalog.count > 0 and
            .installedCatalog.indexed > 0 and
            .installedCatalog.pageBounded == true and
            .installedCatalog.studyUnchanged == true and
            .installedCatalog.pathLeak == false and
            .installedCatalog.opaquePreviewUrls == true and
            .installedCatalog.previewAvailable == true and
            .installedCatalog.fontLoaded == true and
            .installedCatalog.cancellation.acknowledged == true and
            .installedCatalog.cancellation.obsoleteResultCancelled == true and
            .installedCatalog.cancellation.durationMs <= 100 and
            (.semanticAudit.unnamed | length) == 0 and
            (.semanticAudit.duplicateIds | length) == 0 and
            .semanticAudit.horizontalOverflow == false and
            .semanticAudit.roleHelpSeparated == true and
            .semanticAudit.layout.minControlHeight >= 44 and
            .semanticAudit.layout.iconOnlyButtons > 0 and
            .semanticAudit.layout.iconCentersAligned == true and
            .semanticAudit.layout.selectCarets >= 3 and
            .semanticAudit.layout.selectCaretsComplete == true and
            .semanticAudit.layout.selectCaretsCentered == true and
            .semanticAudit.layout.selectCaretInset >= 14 and
            .semanticAudit.layout.panelTopSpread <= 1 and
            .semanticAudit.layout.panelBottomSpread <= 1 and
            .semanticAudit.layout.panelTrayGap <= 1 and
            (.semanticAudit.layout.horizontalOverflows | length) == 0 and
            .disclosureMotion.expanded == true and
            .disclosureMotion.collapsed == true and
            .disclosureMotion.openIntermediate == true and
            .disclosureMotion.closeIntermediate == true and
            .disclosureMotion.caretRotates == true and
            .reloadRecovery.after.activeElement == "workspace-heading" and
            .reloadRecovery.after.reviewState == "Keep" and
            .reloadRecovery.after.stage == .reloadRecovery.before.stage and
            .rendererCrashRecovery.forced == true and
            .rendererCrashRecovery.boot.stage == .rendererCrashRecovery.before.stage and
            .rendererCrashRecovery.boot.activeElement == "workspace-heading" and
            .rendererCrashRecovery.after.activeElement == "workspace-heading" and
            .rendererCrashRecovery.after.reviewState == "Keep" and
            .transactionalHandoff.fileCount >= 2
          ' "$EVIDENCE/trace.json" >/dev/null
          for image in 01-review 02-compare 03-system 04-handoff 05-recovered 06-catalog; do
            test -s "$EVIDENCE/$image.png"
            file "$EVIDENCE/$image.png" | grep -q 'PNG image data'
          done
          cd "$EVIDENCE"
          sha256sum -c checksums.sha256

      - name: Run native Wayland/Ozone evidence
        env:
          FONT_PREVIEWER_WAYLAND_SMOKE_PATH: ${{ runner.temp }}/font-previewer-wayland-evidence/wayland-smoke.json
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          runtime="$RUNNER_TEMP/font-previewer-wayland-runtime"
          evidence="$RUNNER_TEMP/font-previewer-wayland-evidence"
          mkdir -p "$runtime"
          mkdir -p "$evidence"
          chmod 700 "$runtime"
          XDG_RUNTIME_DIR="$runtime" weston --backend=headless-backend.so --use-pixman --socket=wayland-font-previewer --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          cleanup_wayland() { kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true; }
          trap cleanup_wayland EXIT
          for _ in $(seq 1 100); do test -S "$runtime/wayland-font-previewer" && break; sleep 0.1; done
          test -S "$runtime/wayland-font-previewer"
          env -u DISPLAY \
            XDG_RUNTIME_DIR="$runtime" \
            WAYLAND_DISPLAY=wayland-font-previewer \
            XDG_SESSION_TYPE=wayland \
            ELECTRON_OZONE_PLATFORM_HINT=wayland \
            timeout --signal=TERM --kill-after=10s 4m \
            dbus-run-session -- npm run electron -- \
              --ozone-platform=wayland \
              --enable-features=UseOzonePlatform \
              --disable-dev-shm-usage
          jq -e '
            .platform == "linux" and
            .display == null and
            .waylandDisplay == "wayland-font-previewer" and
            .sessionType == "wayland" and
            .ozonePlatformHint == "wayland" and
            (.commandLine | index("--ozone-platform=wayland")) != null and
            (.renderer.heading | type) == "string" and
            (.renderer.host | contains("electron")) and
            (.renderer.stage | test("Review|Compare|System|Handoff")) and
            .renderer.candidates > 0
          ' "$FONT_PREVIEWER_WAYLAND_SMOKE_PATH" >/dev/null
          cp "$RUNNER_TEMP/weston.log" "$evidence/weston.log"
          (cd "$evidence" && sha256sum wayland-smoke.json weston.log > checksums.sha256 && sha256sum -c checksums.sha256)

      - name: Assemble Linux release candidates
        run: node scripts/package-linux.mjs

      - name: Verify Linux package reproducibility and hygiene
        run: |
          cp release/checksums.sha256 "$RUNNER_TEMP/first-package-checksums.sha256"
          npm run audit:package
          node scripts/package-linux.mjs
          cmp "$RUNNER_TEMP/first-package-checksums.sha256" release/checksums.sha256
          npm run audit:package
          printf '%s\n' "$VERIFIED_SHA" > release/SOURCE_SHA

      - name: Inspect Linux packages
        run: |
          cd release
          sha256sum -c checksums.sha256
          test "$(cat SOURCE_SHA)" = "$VERIFIED_SHA"
          dpkg-deb --info font-previewer_0.1.0_amd64.deb
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q -- '-rwsr-xr-x root/root.*chrome-sandbox'
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q 'usr/bin/font-previewer -> ../../opt/font-previewer/font-previewer'
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q 'opt/font-previewer/resources/app/LICENSE.txt'
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q 'opt/font-previewer/resources/app/THIRD_PARTY_NOTICES.md'
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q 'opt/font-previewer/resources/app/sbom.cdx.json'
          dpkg-deb --contents font-previewer_0.1.0_amd64.deb | grep -q 'opt/font-previewer/resources/app/INSTALL.md'

      - name: Round-trip Linux portable and installed packages
        run: |
          run_package_journey() {
            journey_binary="$1"
            journey_evidence="$2"
            journey_config="$3"
            mkdir -p "$journey_evidence" "$journey_config"
            FONT_PREVIEWER_EVIDENCE_DIR="$journey_evidence" \
              XDG_CONFIG_HOME="$journey_config" \
              timeout --signal=TERM --kill-after=10s 4m \
              xvfb-run --auto-servernum --server-args="-screen 0 1500x980x24" \
              dbus-run-session -- "$journey_binary" --disable-dev-shm-usage
            jq -e '
              .installedCatalog.count > 0 and
              .installedCatalog.cancellation.acknowledged == true and
              .installedCatalog.cancellation.obsoleteResultCancelled == true and
              .installedCatalog.cancellation.durationMs <= 100 and
              .reloadRecovery.after.activeElement == "workspace-heading" and
              .reloadRecovery.after.reviewState == "Keep" and
              .transactionalHandoff.fileCount >= 2
            ' "$journey_evidence/trace.json" >/dev/null
            (cd "$journey_evidence" && sha256sum -c checksums.sha256)
          }

          portable_root="$RUNNER_TEMP/font-previewer-portable-roundtrip"
          mkdir -p "$portable_root"
          sudo tar -xzf release/Font-Previewer-0.1.0-linux-x64.tar.gz -C "$portable_root"
          portable_binary="$portable_root/linux-unpacked/font-previewer"
          test -x "$portable_binary"
          test "$(stat --format='%U:%G %a' "$portable_root/linux-unpacked/chrome-sandbox")" = "root:root 4755"
          run_package_journey \
            "$portable_binary" \
            "$RUNNER_TEMP/font-previewer-linux-package-smoke/portable" \
            "$RUNNER_TEMP/font-previewer-linux-package-config/portable"

          package_installed=0
          cleanup_installed_package() {
            if test "$package_installed" -eq 1; then sudo dpkg --remove font-previewer || true; fi
          }
          trap cleanup_installed_package EXIT
          sudo apt-get install --yes "$PWD/release/font-previewer_0.1.0_amd64.deb"
          package_installed=1
          test "$(dpkg-query -W -f='${Version}' font-previewer)" = "0.1.0"
          test "$(readlink -f /usr/bin/font-previewer)" = "/opt/font-previewer/font-previewer"
          test "$(stat --format='%U:%G %a' /opt/font-previewer/chrome-sandbox)" = "root:root 4755"
          test "$(sha256sum /opt/font-previewer/font-previewer | cut -d' ' -f1)" = "$(sha256sum release/deb-root/opt/font-previewer/font-previewer | cut -d' ' -f1)"
          run_package_journey \
            /usr/bin/font-previewer \
            "$RUNNER_TEMP/font-previewer-linux-package-smoke/installed" \
            "$RUNNER_TEMP/font-previewer-linux-package-config/installed"
          sudo dpkg --remove font-previewer
          package_installed=0
          trap - EXIT
          test ! -e /usr/bin/font-previewer
          test ! -e /opt/font-previewer
          test ! -e /usr/share/applications/font-previewer.desktop
          test ! -e /usr/share/icons/hicolor/512x512/apps/font-previewer.png
          if dpkg-query -W -f='${db:Status-Status}\n' font-previewer 2>/dev/null | grep -qx installed; then exit 1; fi

      - name: Upload Linux package round-trip evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-linux-package-smoke-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-linux-package-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-linux-evidence-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-linux-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux soak evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-linux-soak-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-linux-soak
          if-no-files-found: error
          retention-days: 14

      - name: Upload Wayland evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-wayland-evidence-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-wayland-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux packages
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-linux-${{ env.VERIFIED_SHA }}
          path: |
            app/release/Font-Previewer-0.1.0-linux-x64.tar.gz
            app/release/font-previewer_0.1.0_amd64.deb
            app/release/checksums.sha256
            app/release/SOURCE_SHA
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS WKWebView · evidence · app
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.VERIFIED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
          package-manager-cache: false

      - name: Verify version surfaces
        run: npm run version:check

      - name: Inspect Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install locked Studio dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Set reproducible package epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Verify shared Studio
        run: npm run build

      - name: Assert verification did not change tracked source
        run: git diff --exit-code

      - name: Run 500-face long-session diagnostic
        env:
          FONT_PREVIEWER_SOAK_OUTPUT: ${{ runner.temp }}/font-previewer-macos-soak/soak.json
        run: npm run evidence:soak

      - name: Build, ad-hoc sign, and verify Mac app
        env:
          FONT_PREVIEWER_MAC_OUTPUT_DIR: ${{ runner.temp }}/font-previewer-macos-build
        run: |
          ./scripts/build-macos-host.sh
          APP="$RUNNER_TEMP/font-previewer-macos-build/Font Previewer.app"
          test -x "$APP/Contents/MacOS/FontPreviewer"
          test -s "$APP/Contents/Resources/Studio/index.html"
          test -s "$APP/Contents/Resources/LICENSE.txt"
          test -s "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -s "$APP/Contents/Resources/sbom.cdx.json"
          test -s "$APP/Contents/Resources/INSTALL.md"
          test -s "$APP/Contents/Resources/FontPreviewer.icns"
          plutil -lint "$APP/Contents/Info.plist"
          codesign -d --verbose=4 "$APP" 2>&1 | grep -q 'flags=.*runtime'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dog.pitch.fontpreviewer"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (
            cd "$RUNNER_TEMP/font-previewer-macos-build"
            test "$(cut -c 67- 'Font Previewer.zip.sha256')" = "Font Previewer.zip"
            shasum -a 256 -c "Font Previewer.zip.sha256"
            printf '%s\n' "$VERIFIED_SHA" > SOURCE_SHA
          )

      - name: Run displayed WKWebView release evidence
        env:
          FONT_PREVIEWER_MAC_EVIDENCE_DIR: ${{ runner.temp }}/font-previewer-macos-evidence
        run: |
          mkdir -p "$FONT_PREVIEWER_MAC_EVIDENCE_DIR"
          BIN="$RUNNER_TEMP/font-previewer-macos-build/Font Previewer.app/Contents/MacOS/FontPreviewer"
          "$BIN" >"$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stdout.log" 2>"$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log" &
          PID=$!
          for _ in $(seq 1 240); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            wait "$PID" || true
            exit 124
          fi
          STATUS=0
          wait "$PID" || STATUS=$?
          if test "$STATUS" -ne 0; then
            test ! -f "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log" || cat "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log"
            test ! -f "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/failure.txt" || cat "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/failure.txt"
            exit "$STATUS"
          fi

      - name: Assert Mac evidence
        env:
          EVIDENCE: ${{ runner.temp }}/font-previewer-macos-evidence
        run: |
          jq -e '
            .host == "wkwebview" and
            .nativeMenu.installed == true and
            .nativeMenu.import == true and
            .nativeMenu.undo == true and
            .nativePanel.opened >= 1 and
            .nativePanel.cancelled >= 1 and
            .nativePanelFocus == "import-fonts-button" and
            .installedCatalog.count > 0 and
            .installedCatalog.indexed > 0 and
            .installedCatalog.pageBounded == true and
            .installedCatalog.studyUnchanged == true and
            .installedCatalog.pathLeak == false and
            .installedCatalog.opaquePreviewUrls == true and
            .installedCatalog.previewAvailable == true and
            .installedCatalog.fontLoaded == true and
            .installedCatalog.cancellation.acknowledged == true and
            .installedCatalog.cancellation.obsoleteResultCancelled == true and
            .installedCatalog.cancellation.durationMs <= 100 and
            .transactionalHandoffFault.failureObserved == true and
            .transactionalHandoffFault.priorExportByteIdentical == true and
            .transactionalHandoffFault.stagingClean == true and
            .transactionalHandoffFault.finalFolderCount == 1 and
            .security.attempts == .security.rejected and
            .security.nodeUnavailable == true and
            .keyboardAccessibility.forwardWrap == true and
            .keyboardAccessibility.backwardWrap == true and
            .keyboardAccessibility.candidateUnchanged == true and
            .keyboardAccessibility.trayUnchanged == true and
            .keyboardAccessibility.returnFocus == true and
            .semantics.unnamed == 0 and
            .semantics.duplicateIds == 0 and
            .semantics.horizontalOverflow == false and
            .semantics.roleHelpSeparated == true and
            .simpleVisual.stateTravel.added > 0 and
            .simpleVisual.stateTravel.simpleAfter == .simpleVisual.stateTravel.studioAfter and
            .simpleVisual.stateTravel.fitPolicy == "locked-lines" and
            .simpleVisual.stateTravel.restored == true and
            .simpleVisual.scale["80"].minTouchHeight >= 44 and
            .simpleVisual.scale["80"].horizontalOverflow == false and
            .simpleVisual.scale["140"].minTouchHeight >= 44 and
            .simpleVisual.scale["140"].horizontalOverflow == false and
            .simpleVisual.boards.longCopy.quadrants == 4 and
            .simpleVisual.boards.longCopy.fullText == true and
            .simpleVisual.boards.longCopy.withinFrames == true and
            .simpleVisual.boards.longCopy.noEllipsis == true and
            .simpleVisual.boards.longCopy.paletteCount == 4 and
            .simpleVisual.boards.lockedLines.count == 4 and
            .simpleVisual.boards.lockedLines.fullText == true and
            .simpleVisual.boards.lockedLines.sharedSize == true and
            .simpleVisual.boards.lockedLines.whiteSpace == true and
            .simpleVisual.boards.stress.rupee == true and
            .simpleVisual.boards.stress.copyright == true and
            .simpleVisual.boards.stress.trademark == true and
            .simpleVisual.boards.stress.numerals == true and
            .simpleVisual.tuning.cards > 0 and
            .simpleVisual.tuning.apTitle == true and
            .simpleVisual.tuning.axisSliders > 0 and
            .simpleVisual.tuning.minButtonHeight >= 44 and
            .simpleVisual.catalog.count > 0 and
            .simpleVisual.catalog.overlaps == 0 and
            .simpleVisual.catalog.horizontalOverflow == false and
            .simpleVisual.detail.rendered == true and
            .simpleVisual.detail.styleRows > 0 and
            .simpleVisual.detail.horizontalOverflow == false and
            .studioVisual.scale["80"].minTouchHeight >= 44 and
            .studioVisual.scale["80"].candidateTruncation == 0 and
            .studioVisual.scale["140"].minTouchHeight >= 44 and
            .studioVisual.scale["140"].candidateTruncation == 0 and
            .studioVisual.review.candidateTruncation == 0 and
            .studioVisual.compare.fullText == true and
            .studioVisual.compare.noEllipsis == true and
            .studioVisual.compare.overflow == 0 and
            .studioVisual.lockedLines.fullText == true and
            .studioVisual.lockedLines.sharedSize == true and
            .studioVisual.lockedLines.whiteSpace == true and
            .studioVisual.system.displayComplete == true and
            .studioVisual.system.displayOverflow == false and
            .studioVisual.handoff.workspaceFullWidth == true and
            .studioVisual.handoff.titlebarVisible == true and
            .studioVisual.handoff.horizontalOverflow == false and
            .reload.after.activeElement == "workspace-heading" and
            .reload.after.reviewState == "Keep" and
            .terminationCallbackRecovery.simulatedDelegateCallback == true and
            .terminationCallbackRecovery.counterAdvanced == true and
            .terminationCallbackRecovery.after.activeElement == "workspace-heading" and
            .terminationCallbackRecovery.after.reviewState == "Keep"
          ' "$EVIDENCE/run.json" >/dev/null
          for image in \
            01-review 02-compare 03-system 04-handoff 05-recovered 06-catalog \
            07-simple 08-simple-catalog 09-simple-styles 10-simple-scale-140 \
            11-simple-scale-80 12-simple-long-copy 13-simple-locked-lines \
            14-simple-tuning 15-simple-full-preview 16-studio-catalog-styles \
            17-studio-scale-140 18-studio-scale-80 19-studio-compare-long-copy \
            20-studio-compare-locked-lines; do
            test -s "$EVIDENCE/$image.png"
            file "$EVIDENCE/$image.png" | grep -q 'PNG image data'
          done

      - name: Round-trip packaged Mac archive
        env:
          FONT_PREVIEWER_MAC_EVIDENCE_DIR: ${{ runner.temp }}/font-previewer-macos-package-smoke
          CFFIXED_USER_HOME: ${{ runner.temp }}/font-previewer-macos-package-home
        run: |
          roundtrip_root="$RUNNER_TEMP/font-previewer-macos-package-roundtrip"
          mkdir -p "$roundtrip_root" "$FONT_PREVIEWER_MAC_EVIDENCE_DIR" "$CFFIXED_USER_HOME"
          ditto -x -k "$RUNNER_TEMP/font-previewer-macos-build/Font Previewer.zip" "$roundtrip_root"
          roundtrip_app="$roundtrip_root/Font Previewer.app"
          roundtrip_binary="$roundtrip_app/Contents/MacOS/FontPreviewer"
          test -x "$roundtrip_binary"
          codesign --verify --deep --strict --verbose=2 "$roundtrip_app"
          "$roundtrip_binary" >"$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stdout.log" 2>"$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log" &
          roundtrip_pid=$!
          for _ in $(seq 1 240); do
            if ! kill -0 "$roundtrip_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$roundtrip_pid" 2>/dev/null; then
            kill "$roundtrip_pid"
            wait "$roundtrip_pid" || true
            exit 124
          fi
          roundtrip_status=0
          wait "$roundtrip_pid" || roundtrip_status=$?
          if test "$roundtrip_status" -ne 0; then
            test ! -f "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log" || cat "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/host.stderr.log"
            test ! -f "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/failure.txt" || cat "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/failure.txt"
            exit "$roundtrip_status"
          fi
          jq -e '
            .installedCatalog.count > 0 and
            .installedCatalog.cancellation.acknowledged == true and
            .installedCatalog.cancellation.obsoleteResultCancelled == true and
            .installedCatalog.cancellation.durationMs <= 100 and
            .transactionalHandoffFault.failureObserved == true and
            .transactionalHandoffFault.priorExportByteIdentical == true and
            .transactionalHandoffFault.stagingClean == true and
            .reload.after.activeElement == "workspace-heading" and
            .reload.after.reviewState == "Keep"
          ' "$FONT_PREVIEWER_MAC_EVIDENCE_DIR/run.json" >/dev/null
          test "$roundtrip_app" = "$RUNNER_TEMP/font-previewer-macos-package-roundtrip/Font Previewer.app"
          rm -rf -- "$roundtrip_app"
          test ! -e "$roundtrip_app"

      - name: Upload Mac package round-trip evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-macos-package-smoke-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-macos-package-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Mac evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-macos-evidence-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-macos-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Mac soak evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: font-previewer-macos-soak-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/font-previewer-macos-soak
          if-no-files-found: error
          retention-days: 14

      - name: Upload Mac app
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
