name: P1 macOS WKWebView evidence

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/p1-macos-shared-studio
    paths:
      - ".github/workflows/p1-macos-evidence.yml"
      - "prototypes/p1-shared-studio/macos/**"
      - "prototypes/p1-shared-studio/scripts/build-macos-host.sh"
      - "prototypes/p1-shared-studio/src/**"
      - "prototypes/p1-shared-studio/tests/**"
      - "prototypes/p1-shared-studio/index.html"
      - "prototypes/p1-shared-studio/package.json"
      - "prototypes/p1-shared-studio/package-lock.json"
      - "prototypes/p1-shared-studio/tsconfig*.json"
      - "prototypes/p1-shared-studio/vite*.ts"

permissions:
  contents: read

concurrency:
  group: p1-macos-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: WKWebView fixture and evidence
    runs-on: macos-14
    timeout-minutes: 20

    defaults:
      run:
        working-directory: prototypes/p1-shared-studio

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: prototypes/p1-shared-studio/package-lock.json
          package-manager-cache: false

      - name: Inspect toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install locked Studio dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Verify and bundle the shared Studio
        run: npm run build

      - name: Build and verify WKWebView Host
        env:
          P1_MAC_OUTPUT_DIR: ${{ runner.temp }}/p1-macos-build
        run: |
          set -euo pipefail
          ./scripts/build-macos-host.sh
          APP="$RUNNER_TEMP/p1-macos-build/Font Previewer P1.app"
          test -x "$APP/Contents/MacOS/FontPreviewerP1"
          test -s "$APP/Contents/Resources/Studio/index.html"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "dog.pitch.fontpreviewer.p1"
          codesign --verify --deep --strict --verbose=2 "$APP"
          shasum -a 256 -c "$RUNNER_TEMP/p1-macos-build/Font Previewer P1.zip.sha256"

      - name: Run displayed WKWebView evidence flow
        env:
          P1_MAC_EVIDENCE_DIR: ${{ runner.temp }}/p1-macos-wkwebview
        run: |
          set -euo pipefail
          mkdir -p "$P1_MAC_EVIDENCE_DIR"
          BIN="$RUNNER_TEMP/p1-macos-build/Font Previewer P1.app/Contents/MacOS/FontPreviewerP1"
          "$BIN" >"$P1_MAC_EVIDENCE_DIR/host.stdout.log" 2>"$P1_MAC_EVIDENCE_DIR/host.stderr.log" &
          PID=$!
          for _ in $(seq 1 180); do
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            wait "$PID" || true
            echo "WKWebView evidence timed out" >&2
            exit 124
          fi
          wait "$PID"
          jq -e '
            .host == "wkwebview" and
            .nativePanel.opened >= 1 and
            .nativePanel.cancelled >= 1 and
            .nativePanel.focusRestoredTo == "import-fonts-button" and
            .nativeMenu.installed == true and
            .security.bundledLocalContentOnly == true and
            .security.rejectedBridgeRequests == 3 and
            .reload.after.activeElement == "workspace-heading" and
            .accessibilitySemantics.unnamedInteractiveElements == 0
          ' "$P1_MAC_EVIDENCE_DIR/run.json" >/dev/null
          for image in 01-review 02-compare 03-system 04-handoff 05-recovered; do
            test -s "$P1_MAC_EVIDENCE_DIR/$image.png"
            file "$P1_MAC_EVIDENCE_DIR/$image.png" | grep -q 'PNG image data'
          done

      - name: Upload WKWebView evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p1-macos-wkwebview-${{ github.run_id }}
          path: ${{ runner.temp }}/p1-macos-wkwebview
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged prototype
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p1-macos-host-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p1-macos-build/Font Previewer P1.zip
            ${{ runner.temp }}/p1-macos-build/Font Previewer P1.zip.sha256
          if-no-files-found: error
          retention-days: 14
