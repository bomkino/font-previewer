name: P1 Linux evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-linux-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Electron fixture and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: prototypes/p1-shared-studio

    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: prototypes/p1-shared-studio/package-lock.json
          package-manager-cache: false

      - name: Install desktop evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 xauth xvfb

      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Install exact Electron binary
        run: npm run electron:install

      - name: Verify types, tests, renderer, Host, preload, and SBOM
        run: npm run build

      - name: Run displayed Electron evidence flow
        env:
          P1_EVIDENCE_DIR: ${{ runner.temp }}/p1-linux-electron
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x960x24" \
            dbus-run-session -- npm run electron -- --disable-dev-shm-usage

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p1-linux-electron-${{ github.run_id }}
          path: ${{ runner.temp }}/p1-linux-electron
          if-no-files-found: error
          retention-days: 7
